name: ci

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: |
          pnpm exec turbo run lint --filter='!@workspace/web'
          pnpm --filter @workspace/web lint:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          # Parsed while Next compiles the server container. No database is started.
          # Required placeholders from apps/web/.env.example and packages/database/.env.example.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapbug
          AUTH_SECRET: your-secret-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: your-resend-api-key-here
          EMAIL_FROM: noreply@snapbug.com
